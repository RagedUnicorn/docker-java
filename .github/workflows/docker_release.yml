name: Release Build

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [jdk, jre]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build test image (${{ matrix.variant }})
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.variant }}
          # Single-platform, daemon-loaded, no attestation manifest so the
          # Container Structure Tests can inspect the image (an OCI index would
          # fail with "no such image"). See TEST.md troubleshooting.
          load: true
          provenance: false
          platforms: linux/amd64
          tags: ragedunicorn/java:test-${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - name: Run Container Structure Tests (${{ matrix.variant }})
        env:
          JAVA_JDK_TEST_VERSION: test-jdk
          JAVA_JRE_TEST_VERSION: test-jre
        run: |
          echo "::notice title=🧪 Running Tests::Validating Docker image before release..."
          docker compose -f docker-compose.test.yml pull

          echo "::group::Running all Container Structure Tests (${{ matrix.variant }})"
          docker compose -f docker-compose.test.yml run --rm test-all-${{ matrix.variant }}
          echo "::endgroup::"

          echo "::notice title=✅ Tests Passed::All Container Structure Tests completed successfully!"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Build arm64 test image (${{ matrix.variant }})
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.variant }}
          load: true
          provenance: false
          platforms: linux/arm64
          tags: ragedunicorn/java:test-${{ matrix.variant }}-arm64
          cache-from: type=gha,scope=${{ matrix.variant }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-arm64
      - name: Smoke test arm64 image (${{ matrix.variant }})
        shell: bash
        env:
          IMAGE: ragedunicorn/java:test-${{ matrix.variant }}-arm64
        run: |
          # os.arch reports the architecture the JVM was built for. An amd64 JVM
          # in the arm64 image would still run natively on the amd64 runner, so
          # assert the JVM reports aarch64
          echo "::group::Checking JVM architecture under QEMU"
          SETTINGS=$(docker run --rm --platform linux/arm64 "$IMAGE" -XshowSettings:properties -version 2>&1)
          echo "$SETTINGS" | grep -E 'os\.arch|version'
          if ! echo "$SETTINGS" | grep -Eq 'os\.arch = aarch64$'; then
            echo "::error title=❌ Wrong Architecture::the ${{ matrix.variant }} arm64 image does not run an aarch64 JVM"
            exit 1
          fi
          echo "::endgroup::"

          if [ "${{ matrix.variant }}" = "jdk" ]; then
            echo "::group::Compiling and running a hello-world program and checking Maven on arm64"
            docker run --rm --platform linux/arm64 --entrypoint sh "$IMAGE" -c \
              'cd /tmp && printf "public class Hello { public static void main(String[] a) { System.out.println(\"hello from \" + System.getProperty(\"os.arch\")); } }\n" > Hello.java && javac Hello.java && java Hello && mvn -v'
            echo "::endgroup::"
          fi

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [jdk, jre]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # docker/metadata-action cannot interleave the variant into the middle
      # of the tag (X.Y.Z-jdk-alpineA.B.C-N) and its generated labels would
      # override the per-variant title/description baked into the Dockerfile
      # stages, so the tags are computed directly instead.
      - name: Compute release metadata
        id: rel
        shell: bash
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          if ! echo "$RAW" | grep -Eq '^[0-9][0-9.]*-alpine[0-9.]+-[0-9]+$'; then
            echo "Tag '${GITHUB_REF_NAME}' does not match v{java_version}-alpine{alpine_version}-{build}" >&2
            exit 1
          fi
          JAVA_VERSION="${RAW%%-*}"
          SUFFIX="${RAW#*-}"
          VARIANT_TAG="${JAVA_VERSION}-${{ matrix.variant }}-${SUFFIX}"
          # ghcr requires a lowercase repository path
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          HUB_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/java"
          if [ "${{ matrix.variant }}" = "jdk" ]; then
            LATEST="latest"
          else
            LATEST="latest-jre"
          fi
          {
            echo "version=${VARIANT_TAG}"
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "tags<<EOF"
            echo "${HUB_IMAGE}:${VARIANT_TAG}"
            echo "${HUB_IMAGE}:${LATEST}"
            echo "${GHCR_IMAGE}:${VARIANT_TAG}"
            echo "${GHCR_IMAGE}:${LATEST}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push Docker image (${{ matrix.variant }})
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.rel.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          build-args: |
            BUILD_DATE=${{ steps.rel.outputs.build_date }}
            VERSION=${{ steps.rel.outputs.version }}

  create-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get previous tag
        id: prev_tag
        run: |
          # Order by tag version, not by tagged commit, so a rebuild tag (-N bump)
          # sharing a commit with the previous release still resolves correctly
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -Fx -A1 "$GITHUB_REF_NAME" | sed -n 2p)
          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT
      - name: Generate changelog
        id: changelog
        run: |
          if [ -z "${{ steps.prev_tag.outputs.previous_tag }}" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            COMMITS=$(git log ${{ steps.prev_tag.outputs.previous_tag }}..${{ github.ref_name }} --pretty=format:"- %s (%h)" --reverse)
          fi
          # Compute the per-variant Docker tags from the git tag
          RAW="${GITHUB_REF_NAME#v}"
          JDK_TAG="${RAW%%-*}-jdk-${RAW#*-}"
          JRE_TAG="${RAW%%-*}-jre-${RAW#*-}"
          REPO_LC="${GITHUB_REPOSITORY,,}"
          # Create changelog
          {
            echo "## What's Changed"
            echo ""
            echo "$COMMITS" | grep -E "^- (feat|fix|docs|style|refactor|perf|test|chore)(\(.+\))?:" || echo "$COMMITS"
            echo ""
            echo "## Docker Images"
            echo ""
            echo "Pull the images:"
            echo '```bash'
            echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/java:${JDK_TAG}"
            echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/java:${JRE_TAG}"
            echo "docker pull ghcr.io/${REPO_LC}:${JDK_TAG}"
            echo "docker pull ghcr.io/${REPO_LC}:${JRE_TAG}"
            echo '```'
            echo ""
            echo "Or use the latest tags:"
            echo '```bash'
            echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/java:latest"
            echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/java:latest-jre"
            echo '```'
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.previous_tag }}...${{ github.ref_name }}"
          } > CHANGELOG.md
          # Store for release body
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: false
          token: ${{ secrets.GITHUB_TOKEN }}
