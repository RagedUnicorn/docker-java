name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  docs-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check docs for hard-coded versions
        shell: bash
        run: |
          # The Dockerfile is the single, Renovate-managed source of the Temurin
          # and Alpine versions. Concrete versions in the docs drift, so use
          # placeholders (<java-version>) or the symbolic X.Y.Z-jdk-alpineA.B.C-N form.
          # The optional ([a-z]+-) also matches the -jdk-/-jre- variant tags
          pattern='[0-9]+(\.[0-9]+)*-([a-z]+-)?alpine[0-9]|alpine:[0-9]|--build-arg [A-Z_]*VERSION=[0-9]|ragedunicorn/[a-z0-9-]+:[0-9]'
          hits=$(git ls-files -z -- '*.md' | xargs -0 grep -HnE "$pattern" || true)
          if [ -n "$hits" ]; then
            while IFS=: read -r file line text; do
              echo "::error file=${file},line=${line},title=Hard-coded version::${text}"
            done <<< "$hits"
            exit 1
          fi
          echo "No hard-coded versions found in the docs"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [jdk, jre]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Java image (${{ matrix.variant }})
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.variant }}
          # Container Structure Tests inspect the image via the Docker daemon,
          # which can only read a single-platform image. load:true loads one
          # platform into the daemon; provenance:false keeps BuildKit from
          # wrapping it in an attestation manifest (an OCI index), which would
          # make the tests fail with "no such image".
          load: true
          provenance: false
          platforms: linux/amd64
          tags: ragedunicorn/java:test-${{ matrix.variant }}
          # Per-variant cache scope: both matrix legs writing the default
          # scope would evict each other's snapshot.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VERSION=test
      - name: Pull Container Structure Test image
        run: docker compose -f docker-compose.test.yml pull
      - name: Run File Structure Tests
        id: file-tests
        continue-on-error: true
        shell: bash
        env:
          JAVA_JDK_TEST_VERSION: test-jdk
          JAVA_JRE_TEST_VERSION: test-jre
        run: |
          echo "::group::📁 File Structure Tests (${{ matrix.variant }})"
          docker compose -f docker-compose.test.yml up --exit-code-from container-test-${{ matrix.variant }} container-test-${{ matrix.variant }} 2>&1 | tee test-file-structure.log
          echo "::endgroup::"
      - name: Run Command Execution Tests
        id: command-tests
        continue-on-error: true
        shell: bash
        env:
          JAVA_JDK_TEST_VERSION: test-jdk
          JAVA_JRE_TEST_VERSION: test-jre
        run: |
          echo "::group::🔧 Command Execution Tests (${{ matrix.variant }})"
          docker compose -f docker-compose.test.yml up --exit-code-from container-test-command-${{ matrix.variant }} container-test-command-${{ matrix.variant }} 2>&1 | tee test-command-execution.log
          echo "::endgroup::"
      - name: Run Metadata Tests
        id: metadata-tests
        continue-on-error: true
        shell: bash
        env:
          JAVA_JDK_TEST_VERSION: test-jdk
          JAVA_JRE_TEST_VERSION: test-jre
        run: |
          echo "::group::🏷️ Metadata Tests (${{ matrix.variant }})"
          docker compose -f docker-compose.test.yml up --exit-code-from container-test-metadata-${{ matrix.variant }} container-test-metadata-${{ matrix.variant }} 2>&1 | tee test-metadata.log
          echo "::endgroup::"
      - name: Test basic Java functionality
        id: basic-tests
        continue-on-error: true
        shell: bash
        run: |
          echo "::group::☕ Basic Java Functionality Test (${{ matrix.variant }})"
          {
            echo "Testing Java version..."
            docker run --rm ragedunicorn/java:test-${{ matrix.variant }} -version
            echo ""
            if [ "${{ matrix.variant }}" = "jdk" ]; then
              echo "Testing javac..."
              docker run --rm --entrypoint javac ragedunicorn/java:test-jdk -version
              echo ""
              echo "Testing mvn..."
              docker run --rm --entrypoint mvn ragedunicorn/java:test-jdk --version
              echo ""
              echo "Testing single-file source launch..."
              docker run --rm -v "$(pwd)/examples:/app" ragedunicorn/java:test-jdk Hello.java
            else
              echo "Verifying javac is absent (JRE must not ship a compiler)..."
              if docker run --rm --entrypoint which ragedunicorn/java:test-jre javac; then
                echo "ERROR: javac found in JRE image"
                exit 1
              fi
              echo "javac is absent as expected"
            fi
          } 2>&1 | tee test-basic-functionality.log
          echo "::endgroup::"
      - name: Generate Test Summary
        if: always()
        run: |
          echo "## 📊 Test Results Summary (${{ matrix.variant }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.file-tests.outcome }}" == "success" ]; then
            echo "| 📁 File Structure | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📁 File Structure | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.command-tests.outcome }}" == "success" ]; then
            echo "| 🔧 Command Execution | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔧 Command Execution | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.metadata-tests.outcome }}" == "success" ]; then
            echo "| 🏷️ Metadata | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🏷️ Metadata | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.basic-tests.outcome }}" == "success" ]; then
            echo "| ☕ Basic Functionality | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ☕ Basic Functionality | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall status
          if [ "${{ steps.file-tests.outcome }}" == "success" ] && \
             [ "${{ steps.command-tests.outcome }}" == "success" ] && \
             [ "${{ steps.metadata-tests.outcome }}" == "success" ] && \
             [ "${{ steps.basic-tests.outcome }}" == "success" ]; then
            echo "### ✅ All tests passed successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Some tests failed. Check the logs for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
      - name: Upload test logs
        if: always() && (steps.file-tests.outcome == 'failure' || steps.command-tests.outcome == 'failure' || steps.metadata-tests.outcome == 'failure' || steps.basic-tests.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.variant }}
          path: |
            test-file-structure.log
            test-command-execution.log
            test-metadata.log
            test-basic-functionality.log
          retention-days: 7
