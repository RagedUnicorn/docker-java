# Docker Compose configuration for Java development
#
# This configuration extends the base build with development-specific settings
#
# Usage:
#   docker compose -f docker-compose.dev.yml build              # Build dev image
#   docker compose -f docker-compose.dev.yml run --rm java-dev  # Get shell
#
# Features:
#   - Builds the jdk target (compiler available)
#   - Mounts the entire project for live editing
#   - Overrides the entrypoint for an interactive shell

services:
  java-dev:
    build:
      context: .
      target: jdk
    image: ragedunicorn/java:dev
    volumes:
      - .:/app
    working_dir: /app
    stdin_open: true
    tty: true
    # Override entrypoint to get a shell
    entrypoint: /bin/sh
    labels:
      org.opencontainers.image.title: "Eclipse Temurin 21 JDK on Alpine Linux (Dev)"
      org.opencontainers.image.description: "Java development environment for testing and debugging"
      org.opencontainers.image.vendor: "ragedunicorn"
    environment:
      - TERM=xterm-256color
