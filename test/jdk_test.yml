schemaVersion: 2.0.0

fileExistenceTests:
  - name: 'Java binary exists'
    path: '/usr/lib/jvm/java-21-temurin/bin/java'
    shouldExist: true

  - name: 'Java compiler exists'
    path: '/usr/lib/jvm/java-21-temurin/bin/javac'
    shouldExist: true

  # Symlink created by java-common's apk trigger
  - name: 'Java symlink exists'
    path: '/usr/bin/java'
    shouldExist: true

  - name: 'Maven binary exists'
    path: '/opt/maven/bin/mvn'
    shouldExist: true

  - name: 'Maven symlink exists'
    path: '/usr/bin/mvn'
    shouldExist: true

  # Pre-created with java ownership (uid/gid 1000) so a named volume mounted
  # here for the local repository is initialized writable for the java user
  - name: 'Maven local repository directory is owned by java'
    path: '/home/java/.m2'
    shouldExist: true
    uid: 1000
    gid: 1000

  # JVM trust store, wired to the system CA bundle by java-cacerts
  - name: 'JVM certificate store exists'
    path: '/usr/lib/jvm/java-21-temurin/lib/security/cacerts'
    shouldExist: true

  - name: 'Working directory exists'
    path: '/app'
    shouldExist: true
    isExecutableBy: 'any'

  - name: 'SSL certificates exist'
    path: '/etc/ssl/certs/ca-certificates.crt'
    shouldExist: true

fileContentTests:
  - name: 'CA certificates installed'
    path: '/etc/ssl/certs/ca-certificates.crt'
    expectedContents: ['-----BEGIN CERTIFICATE-----']
